name: Build Corne Choc Pro firmware
on:
  workflow_dispatch:
    inputs:
      keymap:
        description: "Keymap folder (vial_oled if your halves have OLEDs, else vial)"
        default: vial_oled
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-pip
          python3 -m pip install --break-system-packages -r requirements.txt
      - name: Build
        run: make -j2 keebart/corne_choc_pro/standard:${{ inputs.keymap || 'vial_oled' }}
      - uses: actions/upload-artifact@v4
        with:
          name: corne-choc-pro-firmware
          path: "*.uf2"
